<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="session" content="{{SESSION}}">
<title>DynamicsWar</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<aside class="side" id="side">
  <div class="side-top">
    <button type="button" class="brand" id="home" title="DynamicsWar" aria-label="DynamicsWar - start"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16h.1M10.5 14.5v3M16 16h.1M21.5 13v6"/><path class="loud" d="M27 3v26"/></svg><span class="wordmark">Dynamics<span>War</span></span></button>
    <button type="button" class="icon" id="side-toggle" title="Collapse sidebar" aria-label="Collapse sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg></button>
  </div>
  <nav class="nav" aria-label="Sections">
    <button type="button" id="nav-compare" class="on" title="Compare"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V11M12 20V4M18 20v-6"/></svg><span>Compare</span></button>
    <button type="button" id="nav-library" title="Library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg><span>Library</span></button>
    <button type="button" id="nav-timeline" title="Timeline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V5M4 20h16M7.5 15.5l4-5 3.5 3 4.5-6.5"/></svg><span>Timeline</span></button>
  </nav>
  <div class="side-foot">
    <nav class="nav" aria-label="Settings">
      <button type="button" id="nav-settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.6"/><circle cx="8" cy="17" r="2.6"/></svg><span>Settings</span></button>
    </nav>
    <button type="button" class="account" id="account" title="Account"><i></i><span></span></button>
    <div class="ver" id="ver"></div>
  </div>
</aside>
<div class="page">
  <header class="top">
    <form class="search" id="search-form" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <input id="q" type="search" placeholder="Search artist or album" autocomplete="off" spellcheck="false" aria-label="Search artist or album">
    </form>
  </header>
  <div class="banner" id="demo-banner" hidden>Demo catalogue: invented albums and values, not Qobuz data.</div>
  <div class="banner warn" id="stale-banner" hidden>DynamicsWar was updated. Close this window and start it again &ndash; until then results come from the previous version.</div>
  <main id="main"></main>
</div>

<dialog id="login">
  <form method="dialog" id="login-form">
    <h2 id="login-title">Connect your Qobuz account</h2>
    <p id="login-state" class="state" hidden></p>
    <p id="login-why"></p>
    <ol id="login-steps"></ol>
    <label for="token">Access token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Paste the token here">
    <p class="error" id="login-error" hidden></p>
    <p class="fine" id="login-fine"></p>
    <div class="actions">
      <button type="button" class="ghost" id="login-disconnect" hidden>Disconnect</button>
      <span class="grow"></span>
      <button type="button" class="ghost" id="login-cancel">Close</button>
      <button type="submit" class="primary" id="login-submit">Connect</button>
    </div>
  </form>
</dialog>
<script src="/app.js"></script>
</body>
</html>
